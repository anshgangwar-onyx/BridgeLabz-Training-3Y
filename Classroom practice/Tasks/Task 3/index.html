<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>

    <form action="" method="post">

        <table border="1" cellpadding="10" cellspacing="0">

            <tr>
                <th colspan="2">Student Registration Form</th>
            </tr>

            <tr>
                <td>Full Name:</td>
                <td>
                    <input placeholder="Enter your name" type="text" name="name" id="name">
                </td>
            </tr>

            <tr>
                <td>Email:</td>
                <td>
                    <input placeholder="Enter your email" type="email" name="email" id="email">
                </td>
            </tr>

            <tr>
                <td>Phone Number:</td>
                <td>
                    <input placeholder="Enter your phone number" type="tel" name="phone" id="phone">
                </td>
            </tr>

            <tr>
                <td>Date of Birth:</td>
                <td>
                    <input type="date" name="date" id="date">
                </td>
            </tr>

            <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio" name="gender" id="male" value="male">
                    <label for="male">Male</label>

                    <input type="radio" name="gender" id="female" value="female">
                    <label for="female">Female</label>

                    <input type="radio" name="gender" id="other" value="other">
                    <label for="other">Other</label>
                </td>
            </tr>

            <tr>
                <td>Skills:</td>
                <td>
                    <input type="checkbox" name="skill" value="html">
                    <label>HTML</label>

                    <input type="checkbox" name="skill" value="css">
                    <label>CSS</label>

                    <input type="checkbox" name="skill" value="javascript">
                    <label>JavaScript</label>
                </td>
            </tr>

            <tr>
                <td>Course:</td>
                <td>
                    <select name="course">
                        <option value="">--Select Course--</option>
                        <option value="cse">CSE</option>
                        <option value="ds">Data Science</option>
                        <option value="aiml">AI & ML</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Address:</td>
                <td>
                    <textarea name="address" rows="4" cols="30"></textarea>
                </td>
            </tr>

            <tr>
                <td>Upload Resume:</td>
                <td>
                    <input type="file" name="resume">
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <button type="submit">Register</button>
                    <button type="reset">Reset</button>
                </td>
            </tr>

        </table>

    </form>

</body>
</html>
